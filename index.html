<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wissam Sader: music, Studiomorphik, photography.">
  <title>Wissam Sader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0d0b08; --cream: #efe6d6; --dim: rgba(239, 230, 214, 0.5); --red: #e8382a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow-x: clip; }
    body {
      background: var(--ink);
      color: var(--cream);
      font-family: "Space Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.08; z-index: 5;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    a { color: inherit; text-decoration: none; }

    /* The frame shows the Berlin photo; hovering a link swaps in that world's picture */
    .stage { width: min(62vw, 900px); display: grid; gap: 18px; }
    .frame { position: relative; aspect-ratio: 3 / 2; overflow: hidden; background: #000; }
    .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
    .frame .f-home { opacity: 1; filter: grayscale(1) contrast(1.05); object-position: center 62%; }
    .stage:has(.l-music:hover) .f-music,
    .stage:has(.l-studio:hover) .f-studio,
    .stage:has(.l-photo:hover) .f-photo { opacity: 1; }
    .stage:has(.links a:hover) .f-home { opacity: 0; }

    .row { display: flex; justify-content: space-between; align-items: baseline; }
    .name { letter-spacing: 0.3em; }
    .links { display: flex; gap: 28px; }
    /* Laptop and up: Music and Photography together on the left, Studiomorphik alone on the right */
    @media (min-width: 769px) {
      .links { width: 100%; }
      .links .l-photo { order: 2; }
      .links .l-studio { order: 3; margin-left: auto; }
    }
    .links a { color: var(--dim); transition: color 0.2s ease; }
    .links a:hover { color: var(--red); }
    .meta { color: var(--dim); }
    .meta a:hover { color: var(--cream); }

    @media (max-width: 768px) {
      .stage { width: 100%; }
      .row { gap: 10px; }
      .row:has(.links) { justify-content: center; }
      .name { letter-spacing: 0.22em; }
      .links { gap: 22px; font-size: 12px; letter-spacing: 0.06em; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="row">
      <span class="name">Wissam Sader</span>
      <span class="meta">Sweden / Berlin</span>
    </div>
    <div class="frame">
      <img class="f-home" src="photography/images/388.webp" alt="Berlin in snow, black and white film">
      <img class="f-music" src="landing/music-arcaoda.webp" alt="Live performance in red light">
      <img class="f-studio" src="landing/studio-dancers-grain.webp" alt="Dancers in red light, from the Studiomorphik showreel">
      <img class="f-photo" src="landing/photo-candle-outside.webp" alt="Candle in a plaster arch niche">
    </div>
    <div class="row">
      <nav class="links">
        <a class="l-music" href="music/index.html" target="_blank" rel="noopener">Music</a>
        <a class="l-studio" href="https://studiomorphik.com" target="_blank" rel="noopener">Studiomorphik</a>
        <a class="l-photo" href="photography/index.html" target="_blank" rel="noopener">Photography</a>
      </nav>
    </div>
  </div>
</body>
</html>
