    * {

      padding: 0;
      box-sizing: border-box;

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      line-height: 1.4;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    html {
      overflow-x: hidden;
    }

    /* Header - Sticky */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      text-align: center;
      padding: 12px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #f0f0f0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 0;
    }


    /* Main Gallery Grid */
    .gallery {
      padding: 70px 20px 48px;
      max-width: none;
      margin: 0 auto;
    }

    .gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 80px;
      margin-bottom: 48px;
    }

    .gallery-row {
      display: flex;
      gap: 60px;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .header {
        padding: 0px;
      }
      
      .header h1 {
        font-size: 18px;
      }
      
      .gallery {
        padding: 120px 10px 48px;
      }
      
      .gallery-row {
        gap: 20px;
      }
    }

    .gallery-row.single .project-tile {
      flex: 0 0 60%;
      max-width: 60%;
    }

    .gallery-row.double .project-tile {
      flex: 1;
    }

    .gallery-row.triple .project-tile {
      flex: 1;
    }


    .gallery-row.quadruple .project-tile {
      flex: 1;
    }

    .project-tile {
      position: relative;
    }

    .project-tile img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.2s ease;
    }

    /* Make 44.webp and 77.webp 10% smaller on desktop only */
    .gallery-row.single .project-tile img[src="images/44.webp"],
    .gallery-row.single .project-tile img[src="images/77.webp"] {
      width: 90%;
      margin: 0 auto;
    }

    /* Footer - Sticky */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #ffffff;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: 1px solid #000000;
      z-index: 100;
    }

    .footer a {
      color: #000000;
      text-decoration: underline;
    }

    .footer a:hover {
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        height: 60px;
        line-height: 60px;
        text-align: center;
      }
      
      .gallery {
        padding: 0 15px 32px;
        margin-top: 80px;
      }

      .gallery-grid {
        gap: 50px;
      }

      .gallery-row {
        gap: 30px;
      }

      .gallery-row.single .project-tile {
        flex: 0 0 80%;
        max-width: 80%;
      }
      
      .footer {
        font-size: 8px;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        padding: 0 15px 24px;
      }

      .gallery-grid {
        gap: 40px;
      }

      .gallery-row {
        gap: 20px;
      }

      .gallery-row.single .project-tile,
      .gallery-row.triple .project-tile {
        flex: 1;
      }

      /* Make double rows stack vertically on mobile for bigger images */
      .gallery-row.double {
        flex-direction: column;
        gap: 30px;
      }

      .gallery-row.double .project-tile {
        flex: 1;
      }

      /* Make single rows bigger on mobile */
      .gallery-row.single {
        padding: 0;
      }

      .gallery-row.triple {
        flex-direction: column;
      }

      /* Keep row 16 (31.webp, 46.webp, 47.webp) horizontal on mobile */
      .gallery-row.triple:nth-of-type(16) {
        flex-direction: row;
      }

      /* Make quadruple rows display as 2x2 grid on mobile */
      .gallery-row.quadruple {
        flex-wrap: wrap;
      }

      .gallery-row.quadruple .project-tile {
        flex: 0 0 calc(50% - 10px);
        max-width: calc(50% - 10px);
      }

      /* Make 5.webp 25% bigger on mobile */
      .gallery-row.single .project-tile img[src="images/5.webp"] {
        width: 156.25%;
        margin: 0 auto;
        display: block;
        transform: translateX(-18.125%);
      }

      /* Make 18.webp smaller (15% less than the others) on mobile */
      .gallery-row.single .project-tile img[src="images/18.webp"] {
        width: 112.89%;
        margin: 0 auto;
        display: block;
        transform: translateX(-6.45%);
      }

      /* Reduce gaps between specific rows on mobile - Safari compatible */
      .gallery-row.double:nth-of-type(9) {
        margin-bottom: -20px;
      }

      .gallery-row.single:nth-of-type(12) {
        margin-bottom: -36px;
      }
    }


    /* Still life */
    .still .project-tile img { object-fit: cover; }
    .still.p .project-tile img { aspect-ratio: 3 / 4; }
    .still.l .project-tile img { aspect-ratio: 4 / 3; }
    .chapter {
      text-align: center;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-top: 24px;
      border-top: 1px solid #000000;
      width: 60%;
      margin: 0 auto;

    .switch {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .switch a { color: #000000; text-decoration: none; padding-bottom: 2px; }
    .switch a.on { text-decoration: underline; }
    .set { display: flex; flex-direction: column; gap: inherit; }
    .set[hidden] { display: none; }
    @media (min-width: 769px) {
      .still.p.double { max-width: 75%; margin: 0 auto; width: 100%; }
    }
    /* Two rows left the page, so the page's div:nth-of-type mobile fixes are re-pinned by image */
    @media (max-width: 480px) {
      .gallery-row.double:nth-of-type(9) { margin-bottom: 0; }
      .gallery-row.single:has(img[src="images/18.webp"]) { margin-bottom: -36px; }
      .gallery-row.triple:has(img[src="images/31.webp"]) { flex-direction: row; }
    }
    @media (max-width: 768px) {
      .header.with-switch { height: auto; line-height: normal; padding: 14px 0 10px; }
      .header.with-switch h1 { line-height: 1.2; }
      .header.with-switch .switch { margin-top: 8px; }
      .header.with-switch ~ .gallery { margin-top: 96px; }
      .chapter { width: 100%; }
    }

    #set-still { display: none; }
    body.view-portrait .gallery-grid > section.still { display: none; }
    body.view-still-life .gallery-grid > div.gallery-row,

    body.view-still-life #set-still { display: flex; }
    /* Lazy loading */
    img[loading="lazy"] {
      opacity: 0;
      transition: opacity 0.3s;
    }

    img[loading="lazy"].loaded {
      opacity: 1;
    }

  <script>
    // Lazy loading for images
    document.addEventListener('DOMContentLoaded', function() {
      const images = document.querySelectorAll('img[loading="lazy"]');
      
      if ('IntersectionObserver' in window) {
        const imageObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.addEventListener('load', () => {
                img.classList.add('loaded');
              });
              if (img.complete) {
                img.classList.add('loaded');
              }
              observer.unobserve(img);
            }
          });
        });

        images.forEach(img => imageObserver.observe(img));
      } else {
        // Fallback for older browsers
        images.forEach(img => {
          img.classList.add('loaded');
        });
      }
    });
  </script>

  <script>
    // All / Portrait / Still life. The hash keeps a direct link to each view.
    (function () {
      const links = document.querySelectorAll('.switch a');
      function show(name) {
        document.body.className = 'view-' + name;
        links.forEach(a => a.classList.toggle('on', a.dataset.set === name));
        document.querySelectorAll('img[loading="lazy"]').forEach(img => {
          if (img.complete) img.classList.add('loaded'); else img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        });
        window.scrollTo(0, 0);
      }
      links.forEach(a => a.addEventListener('click', e => {
        e.preventDefault(); history.replaceState(null, '', '#' + a.dataset.set); show(a.dataset.set);
      }));
      const h = location.hash.slice(1);
      show(['portrait', 'still-life'].includes(h) ? h : 'all');
    })();
  </script>
